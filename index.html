<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>15 Anos Yasmim</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENVELOPE -->
    <section id="tela-envelope" class="tela-envelope">

        <img
            class="imagem-envelope"
            src="imagem/file_000000002c34720eb653895a2e8ebbc9.png"
            alt="Envelope do convite">

        <button
            class="area-toque-envelope"
            type="button"
            onclick="abrirConvite()"
            aria-label="Abrir convite">
        </button>

    </section>


    <!-- CONVITE -->
    <main id="tela-convite" class="tela-convite">

        <img
            class="imagem-convite"
            src="imagem/file_000000007758820ea45098fb609d7a44.png"
            alt="Convite de 15 anos de Yasmim">


        <!-- PRESENTES -->
        <a
            class="area-interacao presentes"
            href="lista-presentes.html"
            aria-label="Lista de presentes">
        </a>


        <!-- LOCAL -->
        <a
            class="area-interacao local"
            href="https://www.google.com/maps/search/?api=1&query=R.+Concórdia,+961+-+Concórdia,+Teófilo+Otoni+-+MG,+39804-245"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Local da festa">
        </a>


        <!-- CONFIRMAÇÃO -->
        <a
            class="area-interacao confirmar"
            href="https://yasmimfelix705-a11y.github.io/confirma-o-presen-a-15/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar presença">
        </a>

    </main>


    <script src="script.js"></script>

</body>
</html>
